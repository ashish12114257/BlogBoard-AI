spring.application.name=blogboard-backend
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# PostgreSQL (primary database).
# Credentials are read from environment variables and must NOT be hardcoded.
# DB_URL may be overridden too; the default points at a local PostgreSQL server.
# The "blogboard" database must exist beforehand (PostgreSQL has no
# createDatabaseIfNotExist equivalent).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/blogboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON
spring.jackson.default-property-inclusion=non_null

# CORS is configured programmatically in com.blogboard.config.WebConfig

# ---------------------------------------------------------------------------
# AI blog generation (POST /api/blogs/generate).
# Triggers the existing Python LangGraph workflow in ../blogboard via the
# blogboard/generate.py CLI script. Only the Groq API key is required; it is
# read from .env (llm__api_key or GROQ_API_KEY) at the project root.
# ---------------------------------------------------------------------------
blogboard.generate.python-command=${BLOGBOARD_GENERATE_PYTHON:uv run python}
blogboard.generate.script-path=${BLOGBOARD_GENERATE_SCRIPT:../blogboard/generate.py}
blogboard.generate.timeout-seconds=${BLOGBOARD_GENERATE_TIMEOUT:300}